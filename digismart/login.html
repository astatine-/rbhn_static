<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access DigiSmart - Digital Financial Security</title>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=GA_MEASUREMENT_ID"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'GA_MEASUREMENT_ID', {
            page_title: 'Login Page',
            page_location: window.location.href,
            content_group: 'authentication'
        });
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 4em;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.8em;
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 0.95em;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 0.9em;
        }

        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="email"]:focus,
        input[type="tel"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .or-divider {
            text-align: center;
            margin: 20px 0;
            color: #999;
            font-size: 0.9em;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9em;
            display: none;
        }

        .info-box {
            background: #e3f2fd;
            color: #1565c0;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 0.85em;
            text-align: center;
        }

        .privacy-note {
            text-align: center;
            color: #999;
            font-size: 0.8em;
            margin-top: 20px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 1.5em;
            }

            .logo-icon {
                font-size: 3em;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">🛡️</div>
            <h1>DigiSmart</h1>
            <p class="subtitle">Digital Financial Security Awareness</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="your.email@example.com"
                    autocomplete="email"
                >
            </div>

            <div class="or-divider">OR</div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="+91 98765 43210"
                    autocomplete="tel"
                >
            </div>

            <button type="submit" id="submitBtn">Access Presentation</button>
        </form>

        <div class="info-box">
            🔒 Your information is stored locally on your device only. Access valid for 60 days.
        </div>

        <p class="privacy-note">
            We collect this information for analytics purposes only.<br>
            Your data is not shared with third parties.
        </p>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const phoneInput = document.getElementById('phone');
        const errorMessage = document.getElementById('errorMessage');
        const submitBtn = document.getElementById('submitBtn');

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }

        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        function validatePhone(phone) {
            // Remove all non-digit characters
            const digits = phone.replace(/\D/g, '');
            // Check if it's a valid phone number (at least 10 digits)
            return digits.length >= 10;
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const email = emailInput.value.trim();
            const phone = phoneInput.value.trim();

            // Validate that at least one field is filled
            if (!email && !phone) {
                showError('Please provide either an email address or phone number');
                gtag('event', 'login_error', {
                    error_type: 'empty_fields'
                });
                return;
            }

            // Validate email if provided
            if (email && !validateEmail(email)) {
                showError('Please enter a valid email address');
                gtag('event', 'login_error', {
                    error_type: 'invalid_email'
                });
                return;
            }

            // Validate phone if provided
            if (phone && !validatePhone(phone)) {
                showError('Please enter a valid phone number (at least 10 digits)');
                gtag('event', 'login_error', {
                    error_type: 'invalid_phone'
                });
                return;
            }

            // Store authentication data
            const authData = {
                email: email || null,
                phone: phone || null,
                timestamp: Date.now(),
                expiresAt: Date.now() + (60 * 24 * 60 * 60 * 1000) // 60 days
            };

            localStorage.setItem('digismart-auth', JSON.stringify(authData));

            // Track successful login
            gtag('event', 'login', {
                method: email ? 'email' : 'phone',
                success: true
            });

            // Disable button and show loading state
            submitBtn.disabled = true;
            submitBtn.textContent = 'Redirecting...';

            // Redirect to main page
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 500);
        });

        // Auto-fill for testing (remove in production)
        // Uncomment to enable auto-redirect if already authenticated
        window.addEventListener('load', function() {
            const authData = localStorage.getItem('digismart-auth');
            if (authData) {
                try {
                    const parsed = JSON.parse(authData);
                    if (parsed.expiresAt > Date.now()) {
                        // Already authenticated, redirect
                        window.location.href = 'index.html';
                    }
                } catch (e) {
                    // Invalid auth data, continue with login
                }
            }
        });
    </script>
</body>
</html>
